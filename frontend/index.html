<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Este HTML sirve SOLO la app: app.blisstracker.app (login, registro, selector de
         workspace) y los subdominios de cada agencia. Nada de esto va al índice: son
         pantallas privadas o páginas con token.

         El sitio público (landing, precios, soluciones, blog, legales) se fue a su
         propio proyecto renderizado en el servidor — ver docs/claude/sitio-publico.md.
         Por eso acá ya no hay title de marketing, ni Open Graph, ni canonical de la
         home, ni el fallback estático de contenido para crawlers. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>BlissTracker</title>
    <meta name="description" content="Acceso a tu workspace de BlissTracker." />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />

    <!-- Apple / iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA / Android -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />

    <!-- Tema oscuro: aplicar ANTES del primer paint para evitar flash blanco -->
    <script>
      (function() {
        try {
          // 1. Parámetro ?theme= en la URL (pasado al redirigir desde subdominio — tiene prioridad)
          var theme = new URLSearchParams(window.location.search).get('theme');
          // 2. localStorage (mismo origen)
          if (!theme) theme = localStorage.getItem('theme');
          // 3. Cookie compartida entre subdominios
          if (!theme) {
            var m = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
            theme = m ? m[1] : null;
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>

    <!-- Políticas: absolutas al sitio público, que es donde viven y donde Google las
         verificó para el OAuth. Se declaran en el HTML estático porque el bot de
         verificación no ejecuta JavaScript. -->
    <link rel="privacy-policy" href="https://blisstracker.app/privacidad" />
    <link rel="terms-of-service" href="https://blisstracker.app/condiciones" />

    <!-- Google Analytics vive en el sitio público, no acá: medir la app con la misma
         propiedad mezclaba visitas de marketing con uso interno del producto. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
